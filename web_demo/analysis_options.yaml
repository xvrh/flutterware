include: ../analysis_options.yaml

analyzer:
  exclude:
    - build/**
    # Generated by `app/tool/demo/web_entries.dart`: one wrapper per preview
    # the web demo compiles in, written by the same writer as the guest's
    # own wrappers — which carry every import of the demo they wrap, used or
    # not. The web build is what checks them.
    - demo/entries/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
