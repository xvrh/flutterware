name: brewline
description: A small coffee-shop app, wired up with flutterware — clone it and run one command.
publish_to: none
# A member of the flutterware workspace while it is developed here, so that
# the checkout above is the `flutterware` it resolves. `tool/publish_example.dart`
# drops this line on the way out: a clone has no workspace to belong to.
resolution: workspace
version: 1.0.0

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutterware: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/store/
