# Self-contained on purpose: this project is meant to be cloned on its own, so
# nothing here may reach outside its own directory.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - prefer_single_quotes
    - omit_local_variable_types
