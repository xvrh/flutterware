include: ../../analysis_options.yaml

analyzer:
  exclude:
    - build/**
    # A scene file is ordinary Dart and is analyzed like any other. The ones
    # still listed here are the ones not yet ported: a motion's vocabulary
    # (Track, Key, Curves) has no library until that phase lands, so a scene
    # carrying one cannot compile yet. The list only shrinks.
    - demo/banner.scene.dart
    # The repeater: `lines.item` cannot compile, and the closure that
    # replaces it is its own phase.
    - demo/invoice.scene.dart
    - demo/ohoh.scene.dart
    - demo/promo_badge.scene.dart
    - demo/story_card.scene.dart
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
