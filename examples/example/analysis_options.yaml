include: ../../analysis_options.yaml

analyzer:
  exclude:
    - build/**
    # A scene file — the scene and the motions animating it — is parsed by
    # the flutterware scene tooling, not compiled (yet): its vocabulary has
    # no importable library while the format is a spike, so the analyzer
    # would report every identifier undefined.
    - '**.scene.dart'
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
