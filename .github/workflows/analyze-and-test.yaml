name: Flutterware
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  analyze_and_test:
    name: Flutter analyze
    strategy:
      matrix:
        flutter: ['beta']
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter }}
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
        working-directory: app
      # The root package's own tests. Separate because a pub workspace does not
      # run its members' suites — without this line `test/` here is analyzed
      # and never executed, which is how the inspection wire format sat
      # unguarded while looking covered.
      - run: flutter test
      - run: flutter pub run tool/prepare_submit.dart
      - name: "check for uncommitted changes"
        run: |
          git diff --exit-code --stat -- . ':(exclude)*pubspec.lock' \
          || (echo "##[error] found changed files after build. please run 'dart tool/prepare_submit.dart'" \
                   "and check in all changes" \
              && exit 1)
        shell: bash
      - name: "fw finds its own install"
        # The one thing that runs `fw` as a *process*, from a project that is not
        # the app package, and reaches a plugin action that needs the daemon.
        #
        # It exists because that combination had two independent bugs and nothing
        # could see either. `UiCatalogCore` passed the target package as
        # `appPackageRoot`, so the launch machinery looked for
        # `tool/catalog/compiler_daemon.dart` inside the user's project; and once
        # that was fixed, `dart run app/bin/fw.dart` still had no
        # `APP_TOOL_PATH`, because only the launcher sets it. Every headless
        # catalog action — screenshot, inspect, describe --knobs, check, audit —
        # was broken from `fw` in an ordinary project, in both cases.
        #
        # `headless_check` could not catch it: it builds its own `DaemonConfig`,
        # which is the very step that was wrong, and it runs in-process, which
        # skips how `fw` resolves its own install. A unit test cannot either,
        # since that resolution reads `Platform.script` and the environment.
        # Running the binary is the whole point.
        #
        # `check` and not `screenshot` so this can *block*: it stops at the
        # daemon handshake, launching no guest, so it needs no GPU — which is
        # exactly why the step below cannot block.
        run: dart run ../../app/bin/fw.dart run ui_catalog check
        working-directory: examples/example

      - name: "catalog loop, end to end"
        # Last on purpose: it writes and deletes demo fixtures to test
        # them, so a crash mid-run can leave one behind — and the
        # uncommitted-changes check above would then fail for a reason
        # that has nothing to do with formatting.
        #
        # The one thing that exercises the inspection actions against a real
        # compiler daemon and a real embedder guest. Everything else is either
        # a unit test or a fake.
        #
        # Not blocking yet, and the reason is honest rather than cautious: the
        # guest composites through Metal, and whether a runner VM offers it is
        # not answerable from a desk. Delete `continue-on-error` the first time
        # this is seen green — a check nobody can fail is not a check.
        continue-on-error: true
        run: dart run tool/catalog/headless_check.dart
        working-directory: app
